[project]
name = "monsoon-worker"
version = "0.1.0"
description = "Scheduled jobs for the monsoon early-warning system: daily pipeline, 3-hourly rapid check, officer summary"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    # The backend package: database models, config, services (import `app.…`).
    "monsoon-backend",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

# Local development: the backend repo is cloned next to this one. `editable` means backend changes
# are picked up immediately — no reinstall needed.
[tool.uv.sources]
monsoon-backend = { path = "../monsoon-backend-main", editable = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["jobs", "app"]
